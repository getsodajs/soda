name: Release

# Publishes every package when a version tag is pushed: v0.2.0 publishes
# @getsoda/core 0.2.0, then create-soda 0.2.0, which creates projects
# depending on that core. The packages share one version, so the generator
# never points at a core released from another commit.
#
# Set the version with `bun run release:version 0.2.0`, commit, then tag.
# Uses npm trusted publishing (OIDC): no token, provenance attached
# automatically. A package version already on npm is skipped, so a failed
# release can be run again.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest

      - name: Check the package versions against the tag
        run: |
          version="${GITHUB_REF_NAME#v}"

          for directory in packages/core packages/create-soda; do
            actual="$(node -p "require('./$directory/package.json').version")"

            if [ "$actual" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $directory/package.json version $actual"
              exit 1
            fi
          done

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

      # The core first: create-soda points at it.
      - name: Publish
        run: |
          for directory in packages/core packages/create-soda; do
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              (cd "$directory" && npm publish --access public --ignore-scripts)
            fi
          done
