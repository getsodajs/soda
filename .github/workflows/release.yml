name: Release

# Publishes one package to npm when its tag is pushed:
#   core-v0.2.0         → packages/core (@getsoda/core)
#   create-soda-v0.2.0  → packages/create-soda (create-soda)
# Uses npm trusted publishing (OIDC): no token, provenance attached automatically.
# The first version of a package must be published by hand: trusted publishing
# only works for packages that already exist.

on:
  push:
    tags: ['core-v*', 'create-soda-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest

      - name: Find the package and check its version against the tag
        id: package
        run: |
          tag="$GITHUB_REF_NAME"
          name="${tag%-v*}"
          version="${tag##*-v}"
          directory="packages/$name"

          if [ ! -f "$directory/package.json" ]; then
            echo "No package for tag $tag ($directory)"
            exit 1
          fi

          actual="$(node -p "require('./$directory/package.json').version")"

          if [ "$actual" != "$version" ]; then
            echo "Tag $tag does not match $directory/package.json version $actual"
            exit 1
          fi

          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

      - run: npm publish --access public --ignore-scripts
        working-directory: ${{ steps.package.outputs.directory }}
